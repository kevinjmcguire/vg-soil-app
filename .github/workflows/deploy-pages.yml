# Build the app with Shinylive (R running in the browser via WebAssembly) and
# publish it to GitHub Pages: https://kevinjmcguire.github.io/vg-soil-app/
#
# One-time setup: repository Settings > Pages > Build and deployment >
# Source: "GitHub Actions". After that, every push to main redeploys.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install shinylive
        run: Rscript -e 'install.packages(c("shinylive", "shiny", "bslib"))'

      - name: Export app (only the files the app needs)
        run: |
          mkdir -p _app
          cp -r app.R R data www _app/
          Rscript -e 'shinylive::export("_app", "_site")'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
