# Publish the browser version of the app (docs/) to GitHub Pages:
# https://kevinjmcguire.github.io/vg-soil-app/
#
# docs/ is plain HTML/CSS/JavaScript, so there is no build step.
# One-time setup: repository Settings > Pages > Build and deployment >
# Source: "GitHub Actions". After that, every push to main redeploys.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript Rosetta reference test
        run: node tests/test_rosetta_js.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
