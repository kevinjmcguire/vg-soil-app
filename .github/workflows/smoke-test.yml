# Opens the live GitHub Pages app in headless Chromium after each deploy and
# saves console output and screenshots to the `smoke-test` branch.
name: smoke-test

on:
  workflow_dispatch:
  workflow_run:
    workflows: [deploy-pages]
    types: [completed]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Load the deployed app
        run: python .github/smoke/smoke.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        continue-on-error: true
      - name: Publish results to the smoke-test branch
        run: |
          cd results
          git init -q -b smoke-test
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke test results for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" smoke-test
