name: test-rosetta
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install packages
        run: Rscript -e 'install.packages(c("jsonlite", "shiny", "bslib"))'
      - name: Rosetta reference test
        run: Rscript tests/test_rosetta.R
      - name: App parses
        run: Rscript -e 'for (f in c("app.R", list.files("R", full.names = TRUE))) parse(f)'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript Rosetta reference test
        run: node tests/test_rosetta_js.js
